<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eTechLog</title>
<meta name="description" content="Elektronický technický deník a OFP – testovací verze">
<meta name="theme-color" content="#13202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="eTechLog">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><div class="loading">Načítám technický deník…</div></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script src="version.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
  // a new version took over: reload once so the app runs the new code
  // first install takes control silently; only a later update reloads (and never with a form open)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloaded)return;reloaded=true;
    const busy=document.querySelector('#sheet:not([hidden])');if(!busy)location.reload()});
}
</script>
</body>
</html>
